<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="See Loop Alarm set to remind every 45 minutes and view its app information screen on Apple Watch.">
  <meta name="theme-color" content="#050706">
  <title>Loop Alarm - Apple Watch reminders</title>
  <link rel="canonical" href="https://jamesc0ry.github.io/loop-alarm-site/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="./" aria-label="Loop Alarm home">
      <span class="brand-mark" aria-hidden="true"><span></span></span>
      <span>Loop Alarm</span>
    </a>
    <nav aria-label="Primary navigation">
      <a href="privacy/">Privacy</a>
    </nav>
  </header>

  <main id="main-content" class="app-showcase">
    <h1 class="visually-hidden">Loop Alarm 45-minute reminder and information screen on Apple Watch</h1>
    <figure class="watch-figure" aria-describedby="watch-caption">
      <div class="watch-stage">
        <svg class="connectors connectors-wide" viewBox="0 0 760 540" aria-hidden="true" focusable="false">
          <path d="M194 88 H270 L349 136"></path>
          <path d="M566 88 H530 L444 136"></path>
          <path d="M190 270 H270 L307 254"></path>
          <path d="M566 402 H500 L442 403"></path>
          <circle cx="349" cy="136" r="3"></circle>
          <circle cx="444" cy="136" r="3"></circle>
          <circle cx="307" cy="254" r="3"></circle>
          <circle cx="442" cy="403" r="3"></circle>
        </svg>
        <svg class="connectors connectors-compact" viewBox="0 0 360 660" aria-hidden="true" focusable="false">
          <path d="M86 82 L138 116 L155 197"></path>
          <path d="M274 82 L272 120 L231 197"></path>
          <path d="M86 480 L42 455 V291 H122"></path>
          <path d="M274 480 L318 455 V411 H248"></path>
          <circle cx="155" cy="197" r="3"></circle>
          <circle cx="231" cy="197" r="3"></circle>
          <circle cx="122" cy="291" r="3"></circle>
          <circle cx="248" cy="411" r="3"></circle>
        </svg>

        <ol class="annotations" aria-label="Interface annotations">
          <li class="annotation annotation-toggle">
            <strong>Reminders on</strong>
            <span>Arms the loop</span>
          </li>
          <li class="annotation annotation-information">
            <strong>App information</strong>
            <span>Opens email and website details</span>
          </li>
          <li class="annotation annotation-interval">
            <strong>Crown value</strong>
            <span>Set to every 45 minutes</span>
          </li>
          <li class="annotation annotation-upcoming">
            <strong>Next reminder</strong>
            <span>Mint means armed</span>
          </li>
        </ol>

        <div class="watch-wrap">
          <div class="watch-hardware">
            <span class="digital-crown" aria-hidden="true"></span>
            <span class="side-button" aria-hidden="true"></span>
            <div class="watch-case">
              <div class="watch-screen">
                <span class="screen-toggle" aria-hidden="true"><span></span></span>
                <details class="information-control">
                  <summary aria-controls="app-information">
                    <svg class="information-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                      <circle cx="12" cy="12" r="8.25"></circle>
                      <circle class="information-dot" cx="12" cy="8" r="1"></circle>
                      <path d="M12 11.5v5"></path>
                    </svg>
                    <span class="visually-hidden information-open-label">Loop Alarm information</span>
                    <span class="information-done-label" aria-hidden="true">Done</span>
                    <span class="visually-hidden information-close-label">Done</span>
                  </summary>
                  <section id="app-information" class="information-screen" aria-labelledby="information-title">
                    <h2 id="information-title">Loop Alarm</h2>
                    <a class="information-email" href="mailto:loopalarm.help@outlook.com?subject=Loop%20Alarm%20Support">loopalarm.help@outlook.com</a>
                    <a class="information-site" href="https://jamesc0ry.github.io/loop-alarm-site/">https://jamesc0ry.github.io/loop-alarm-site/</a>
                  </section>
                </details>
                <div class="interval-dial" aria-hidden="true">45</div>
                <div class="interval-unit" aria-hidden="true">
                  <span>min</span>
                </div>
                <div class="upcoming-status" aria-hidden="true">
                  <span>Upcoming:</span>
                  <strong>11:15 AM</strong>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <figcaption id="watch-caption" class="visually-hidden">A rendering of Loop Alarm with reminders on, the interval dial focused at every 45 minutes, and the next reminder armed for 11:15 AM. The information control opens the app information screen with actionable support email and website links.</figcaption>
    </figure>
  </main>

  <footer>
    <p>Loop Alarm</p>
    <nav aria-label="Footer navigation">
      <a href="privacy/">Privacy</a>
    </nav>
  </footer>
</body>
</html>
