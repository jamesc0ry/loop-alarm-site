<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="See the Loop Alarm reminder controls for Apple Watch.">
  <meta name="theme-color" content="#050706">
  <title>Loop Alarm - Apple Watch reminders</title>
  <link rel="canonical" href="https://jamesc0ry.github.io/loop-alarm-site/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="./" aria-label="Loop Alarm home">
      <span class="brand-mark" aria-hidden="true"><span></span></span>
      <span>Loop Alarm</span>
    </a>
    <nav aria-label="Primary navigation">
      <a href="privacy/">Privacy</a>
    </nav>
  </header>

  <main id="main-content" class="app-showcase">
    <h1 class="visually-hidden">Loop Alarm reminder controls on Apple Watch</h1>
    <figure class="watch-figure" aria-describedby="watch-caption">
      <div class="watch-stage">
        <svg class="connectors connectors-wide" viewBox="0 0 760 540" aria-hidden="true" focusable="false">
          <path d="M194 88 H270 L349 136"></path>
          <path d="M566 88 H530 L444 136"></path>
          <path d="M190 270 H270 L307 254"></path>
          <path d="M566 322 H500 L442 315"></path>
          <path d="M198 438 H280 L465 403"></path>
          <circle cx="349" cy="136" r="3"></circle>
          <circle cx="444" cy="136" r="3"></circle>
          <circle cx="307" cy="254" r="3"></circle>
          <circle cx="442" cy="315" r="3"></circle>
          <circle cx="465" cy="403" r="3"></circle>
        </svg>
        <svg class="connectors connectors-compact" viewBox="0 0 360 660" aria-hidden="true" focusable="false">
          <path d="M86 82 L138 116 L155 197"></path>
          <path d="M274 82 L272 120 L231 197"></path>
          <path d="M60 480 L42 455 V291 H122"></path>
          <path d="M180 480 V420 L230 338"></path>
          <path d="M300 480 L318 455 V411 H248"></path>
          <circle cx="155" cy="197" r="3"></circle>
          <circle cx="231" cy="197" r="3"></circle>
          <circle cx="122" cy="291" r="3"></circle>
          <circle cx="230" cy="338" r="3"></circle>
          <circle cx="248" cy="411" r="3"></circle>
        </svg>

        <ol class="annotations" aria-label="Interface annotations">
          <li class="annotation annotation-toggle">
            <strong>Reminders on</strong>
            <span>Arms the loop</span>
          </li>
          <li class="annotation annotation-support">
            <strong>Email support</strong>
            <span>Envelope opens email</span>
          </li>
          <li class="annotation annotation-interval">
            <strong>Crown value</strong>
            <span>1-59 min, then 1 hour</span>
          </li>
          <li class="annotation annotation-hourly">
            <strong>Hourly minute</strong>
            <span>At :45 every hour</span>
          </li>
          <li class="annotation annotation-upcoming">
            <strong>Next reminder</strong>
            <span>Mint means armed</span>
          </li>
        </ol>

        <div class="watch-wrap">
          <div class="watch-hardware">
            <span class="digital-crown" aria-hidden="true"></span>
            <span class="side-button" aria-hidden="true"></span>
            <div class="watch-case">
              <div class="watch-screen">
                <span class="screen-toggle" aria-hidden="true"><span></span></span>
                <a class="support-envelope" href="mailto:loopalarm.help@outlook.com" aria-label="Email Loop Alarm support at loopalarm.help@outlook.com">
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M3.4 5.5h17.2c.7 0 1.2.5 1.2 1.2v10.6c0 .7-.5 1.2-1.2 1.2H3.4c-.7 0-1.2-.5-1.2-1.2V6.7c0-.7.5-1.2 1.2-1.2Zm.5 1.8 7.2 5.5c.5.4 1.3.4 1.8 0l7.2-5.5H3.9Z"></path>
                  </svg>
                </a>
                <div class="interval-dial" aria-hidden="true">1</div>
                <div class="hourly-unit" aria-hidden="true">
                  <span>hour @</span>
                  <span class="hourly-minute">:45</span>
                </div>
                <div class="upcoming-status" aria-hidden="true">
                  <span>Upcoming:</span>
                  <strong>10:45 AM</strong>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <figcaption id="watch-caption" class="visually-hidden">A static rendering of Loop Alarm in hourly mode. Reminders are on, the interval dial is focused at one hour, the hourly minute is 45, and the next reminder is armed for 10:45 AM. Only the support envelope is interactive.</figcaption>
    </figure>
  </main>

  <footer>
    <p>Loop Alarm</p>
    <nav aria-label="Footer navigation">
      <a href="privacy/">Privacy</a>
    </nav>
  </footer>
</body>
</html>
